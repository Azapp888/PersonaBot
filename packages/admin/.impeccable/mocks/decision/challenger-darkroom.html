<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>暗房曝光记录</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+SC:wght@400&display=swap" rel="stylesheet">
<style>
  :root{--bg:#151515;--ink:#d8cf3f;--red:#c0453a;--muted:#8a8a8a;--film:rgba(255,255,255,.04)}
  *{margin:0;box-sizing:border-box}
  body{background:var(--bg);color:#dcdcdc;font-family:"Noto Sans SC",sans-serif;height:100vh;overflow:hidden;display:flex}
  .rail{width:210px;border-right:1px solid #2a2a2a;padding:20px 0}
  .brand{font-size:18px;font-weight:700;padding:0 20px 14px;border-bottom:1px solid #2a2a2a;color:#fff}
  .nav a{display:block;padding:9px 20px;font-size:13px;color:#999;text-decoration:none}
  .nav a.on{color:#fff;background:#1e1e1e}
  .main{flex:1;padding:22px 28px;position:relative}
  .ramp{display:flex;height:34px;margin-bottom:20px}
  .ramp div{flex:1;border-right:1px solid #000}
  .sheet{background:var(--film);border:1px solid #333;padding:18px;position:relative}
  h1{font-size:19px;color:#fff;margin-bottom:14px}
  .row{display:flex;justify-content:space-between;padding:11px 4px;border-bottom:1px dashed #333;font-size:13px}
  .row .sec{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--muted)}
  .hatch{width:60px;height:11px;background:repeating-linear-gradient(45deg,var(--ink) 0 2px,transparent 2px 4px)}
  .conflict{width:60px;height:11px;background:
    repeating-linear-gradient(45deg,var(--red) 0 2px,transparent 2px 4px),
    repeating-linear-gradient(-45deg,var(--red) 0 2px,transparent 2px 4px)}
  .delta{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink)}
  .overlay{position:absolute;top:-10px;left:30px;right:40px;bottom:20px;border:1px solid var(--red);
    border-radius:3px;transform:rotate(-.6deg);pointer-events:none}
</style></head>
<body>
  <aside class="rail"><div class="brand">PersonaBot</div>
    <nav class="nav"><a class="on">仪表盘</a><a>Bot 管理</a><a>角色管理</a><a>模型管理</a>
    <a>记忆管理</a><a>统计</a><a>技能</a><a>系统设置</a></nav></aside>
  <div class="main">
    <div class="ramp">
      <div style="background:#111"></div><div style="background:#1d1d1d"></div><div style="background:#2b2b2b"></div>
      <div style="background:#3a3a3a"></div><div style="background:#4d4d4d"></div><div style="background:#666"></div>
      <div style="background:#808080"></div><div style="background:#9c9c9c"></div><div style="background:#c0c0c0"></div>
      <div style="background:#e0e0e0"></div><div style="background:#f5f5f5"></div>
    </div>
    <div class="sheet">
      <h1>曝光记录 · 今日数据</h1>
      <div class="row"><span>Token 消耗 <span class="sec">128k</span></span><span class="hatch"></span><span class="delta">+1 1/3</span></div>
      <div class="row"><span>缓存命中 <span class="sec">86%</span></span><span class="conflict"></span><span class="delta">CONFLICT</span></div>
      <div class="row"><span>图片生成 <span class="sec">4</span></span><span class="hatch"></span><span class="delta">-2/3</span></div>
      <div class="overlay"></div>
    </div>
  </div>
</body>
</html>
